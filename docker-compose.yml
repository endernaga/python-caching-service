services:
  api: &main_app
    build:
      context: .
      target: dev
      dockerfile: ./Dockerfile
    image: tailored_test_task:${TAILORED_TEST_TASK_VERSION:-latest}
    restart: always
    ports:
      # Exposes application port.
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TAILORED_TEST_TASK_HOST: 0.0.0.0
      TAILORED_TEST_TASK_RELOAD: "True"
      TAILORED_TEST_TASK_DB_HOST: db
      TAILORED_TEST_TASK_DB_PORT: 5432
      TAILORED_TEST_TASK_DB_USER: ${POSTGRES_USER:-tailored_test_task}
      TAILORED_TEST_TASK_DB_PASS: ${POSTGRES_PASSWORD:-tailored_test_task}
      TAILORED_TEST_TASK_DB_BASE: ${POSTGRES_DB:-tailored_test_task}
    volumes:
      - .:/app/src/
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    restart: always
    ports:
      - "5432:5432"
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tailored_test_task}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tailored_test_task}
      POSTGRES_DB: ${POSTGRES_DB:-tailored_test_task}
    volumes:
      - tailored_test_task-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-tailored_test_task} -d ${POSTGRES_DB:-tailored_test_task}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tailored_test_task-db-data:
    name: tailored_test_task-db-data
